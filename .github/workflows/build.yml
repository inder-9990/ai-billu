
name: Build AICompanion APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Repository files:"
          ls -la

          SETTINGS=$(find . -maxdepth 6 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: .
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AICompanion-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
